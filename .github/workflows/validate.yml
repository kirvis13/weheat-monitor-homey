name: Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run test/script.test.ts

  authorship:
    # Public history: every commit by the maintainer (noreply address), no trailers. See CONTRIBUTING.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check authors and trailers
        run: |
          # Both GitHub noreply forms of the maintainer; the website still uses the one without the id.
          ok1="kirvis13 <7209653+kirvis13@users.noreply.github.com>"
          ok2="kirvis13 <kirvis13@users.noreply.github.com>"
          fail=0
          for c in $(git rev-list HEAD); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            committer="$(git log -1 --format='%cn <%ce>' "$c")"
            if [ "$author" != "$ok1" ] && [ "$author" != "$ok2" ]; then echo "::error::$c author is '$author' (see CONTRIBUTING.md)"; fail=1; fi
            if [ "$committer" != "$ok1" ] && [ "$committer" != "$ok2" ] && [ "$committer" != "GitHub <noreply@github.com>" ]; then
              echo "::error::$c committer is '$committer'"; fail=1
            fi
            if git log -1 --format=%B "$c" | grep -qiE '^(co-authored-by:|[a-z-]+-session:)'; then
              echo "::error::$c has a co-author or session trailer (see CONTRIBUTING.md)"; fail=1
            fi
          done
          exit $fail

  release-tag:
    # A tag vX.Y.Z must equal VERSIE in weheat-monitor.js.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          want="v$(sed -nE 's/^const VERSIE = "([0-9.]+)";/\1/p' weheat-monitor.js)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME, script says $want"; exit 1; }
